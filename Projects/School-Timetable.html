<!DOCTYPE html>
<html lang="hy" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Զանգ — դասացուցակ</title>
<meta name="description" content="Դպրոցի դասացուցակը իրական ժամանակում">
<meta name="theme-color" content="#12151c">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ffa94d'/%3E%3Cpath d='M16 7a6 6 0 0 0-6 6v4l-2 3h16l-2-3v-4a6 6 0 0 0-6-6z' fill='%2312151c'/%3E%3C/svg%3E">
<style>
:root{--bg:#0d0e11;--tx:#f1efe9;--mut:#8b8f9a;--line:#23252c;--acc:#ffb066;--on:#0d0e11;--focus:#8fb4ff;--sheet:#15171c;--fill:#1f2229;--acc2:#ff7a59;--glow:rgba(255,176,102,.5);--glow2:rgba(255,176,102,.09);color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);min-height:100dvh;font:16px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Armenian","Sylfaen",Roboto,sans-serif;font-variant-numeric:tabular-nums;overflow-wrap:break-word}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:28rem;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
h1{font-size:1.0625rem;font-weight:600;line-height:1.2}
.nm{display:flex;align-items:center;gap:8px}
.card{text-align:center}
.ring{position:relative;width:clamp(230px,74vw,300px);aspect-ratio:1;margin:12px auto 0}
.ring:before{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(closest-side,var(--glow2),transparent)}
.ring svg{position:relative;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.trk,.arc{fill:none;stroke-width:3}
.trk{stroke:var(--line)}
.arc{stroke:url(#g);stroke-linecap:round;stroke-dasharray:578.05;stroke-dashoffset:578.05;filter:drop-shadow(0 0 5px var(--glow))}
.in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 17%}
.k{font-size:.875rem;color:var(--mut);min-height:1.4em}
.num{font-size:clamp(4rem,22vw,6.5rem);font-weight:200;line-height:1;letter-spacing:-.03em}
.num.mid{font-size:clamp(2.75rem,14vw,4rem);letter-spacing:-.02em}
.num.txt{font-size:clamp(1.4rem,7vw,1.9rem);font-weight:300;letter-spacing:0;line-height:1.2}
.range{font-size:1rem;color:var(--mut);margin-top:16px;min-height:1.45em}
.cdw{display:flex;flex-direction:column;align-items:center;margin-top:16px}
.cdl{color:var(--mut);font-size:.875rem}
.cd{display:inline-block;font-size:clamp(2.5rem,14vw,3.5rem);font-weight:300;line-height:1.15}
[data-s=IN_LESSON] .cd,[data-s=BREAK] .cd{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.next{margin-top:10px;font-size:.9375rem;color:var(--mut)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:20px}
#date{font-size:1rem;font-weight:500}
.dt{margin-top:28px;display:flex;flex-direction:column;align-items:center}
.dt:before{content:"";width:28px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));margin-bottom:16px}
.s0{fill:var(--mut)}
.hd{fill:var(--tx);filter:drop-shadow(0 0 6px var(--acc))}
#head{transform-origin:100px 100px}
.sw{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-size:.9375rem;font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.sw svg{color:var(--acc);flex:none}
.sw:active{background:var(--line)}
@media(min-width:760px){.wrap{padding-top:32px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<noscript><p style="padding:16px">Էջն աշխատելու համար անհրաժեշտ է JavaScript։</p></noscript>
<div class="wrap">
<header>
<div class="brand"><div class="nm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg><h1>Զանգ</h1></div></div>
<button class="sw" id="shiftBtn" type="button"><span id="shiftTxt"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg></button>
</header>
<main>
<section class="card" id="card" data-s="NON_SCHOOL_DAY" aria-label="Ընթացիկ վիճակ">
<div class="ring" id="ring" role="progressbar" aria-label="Դասաժամի ընթացք" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
<svg viewBox="0 0 200 200" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc2)"/></linearGradient></defs><circle class="trk" cx="100" cy="100" r="92"/><circle class="arc" id="arc" cx="100" cy="100" r="92"/><circle class="s0" cx="192" cy="100" r="2"/><g id="head"><circle class="hd" cx="192" cy="100" r="5.5"/></g></svg>
<div class="in"><span class="k" id="k"></span><span class="num" id="num"></span></div></div>
<div class="range" id="range"></div>
<div class="cdw" id="cdw"><span class="cdl">Մնացել է</span><span class="cd" id="cd"></span></div>
<p class="next" id="next"></p>
<div class="dt"><p id="date"></p></div>
</section>
</main>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<script>
'use strict';
/*LOGIC*/
var SHIFTS={
 morning:[[1,'08:30','09:15'],[2,'09:20','10:05'],[3,'10:10','10:55'],[4,'11:00','11:45'],[5,'11:55','12:40'],[6,'12:45','13:30'],[7,'13:35','14:15']],
 evening:[[0,'13:35','14:15'],[1,'14:20','15:00'],[2,'15:05','15:45'],[3,'15:50','16:30'],[4,'16:35','17:15'],[5,'17:20','18:00'],[6,'18:05','18:45'],[7,'18:50','19:30']]
};
var DEFAULTS={shift:'morning',lesson0:true,days:[false,true,true,true,true,true,false]};
function toSec(s){var p=s.split(':');return Number(p[0])*3600+Number(p[1])*60}
function clamp(x){return x<0?0:x>1?1:x}
function getLessons(shift,l0){
 var src=SHIFTS[shift]||SHIFTS.morning,sh=SHIFTS[shift]?shift:'morning';
 return src.filter(function(x){return !(sh==='evening'&&x[0]===0&&!l0)}).map(function(x){
  return{n:x[0],start:toSec(x[1]),end:toSec(x[2]),startStr:x[1],endStr:x[2],shift:sh}});
}
function secOfDay(d){return d.getHours()*3600+d.getMinutes()*60+d.getSeconds()+d.getMilliseconds()/1000}
function nextSchoolDay(d,s){
 var L=getLessons(s.shift,s.lesson0);
 for(var i=1;i<=7;i++){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i);
  if(s.days[x.getDay()])return{offset:i,weekday:x.getDay(),start:L[0].startStr}}
 return null;
}
function computeState(d,s){
 var L=getLessons(s.shift,s.lesson0),t=secOfDay(d);
 if(!s.days[d.getDay()])return{state:'NON_SCHOOL_DAY',lessons:L,nextDay:nextSchoolDay(d,s)};
 var first=L[0],last=L[L.length-1];
 if(t<first.start)return{state:'BEFORE_SCHOOL',lessons:L,next:first,last:last,remaining:first.start-t,progress:clamp(t/first.start)};
 if(t<last.end){
  for(var i=0;i<L.length;i++){var l=L[i],n=L[i+1]||null;
   if(t>=l.start&&t<l.end)return{state:'IN_LESSON',lessons:L,lesson:l,next:n,remaining:l.end-t,progress:clamp((t-l.start)/(l.end-l.start))};
   if(n&&t>=l.end&&t<n.start)return{state:'BREAK',lessons:L,prev:l,next:n,remaining:n.start-t,progress:clamp((t-l.end)/(n.start-l.end))};}
 }
 return{state:'AFTER_SCHOOL',lessons:L,last:last,nextDay:nextSchoolDay(d,s)};
}
function sanitize(o){
 var s={shift:DEFAULTS.shift,lesson0:DEFAULTS.lesson0,days:DEFAULTS.days.slice()};
 if(o&&typeof o==='object'){
  if(o.shift==='evening'||o.shift==='morning')s.shift=o.shift;
  if(typeof o.lesson0==='boolean')s.lesson0=o.lesson0;
  if(Array.isArray(o.days)&&o.days.length===7)s.days=o.days.map(Boolean);
 }
 return s;
}
/*END*/

var KEY='zang.settings.v1',$=function(i){return document.getElementById(i)};
var WD=['Կիրակի','Երկուշաբթի','Երեքշաբթի','Չորեքշաբթի','Հինգշաբթի','Ուրբաթ','Շաբաթ'];
var MO=['հունվարի','փետրվարի','մարտի','ապրիլի','մայիսի','հունիսի','հուլիսի','օգոստոսի','սեպտեմբերի','հոկտեմբերի','նոյեմբերի','դեկտեմբերի'];
var SHS={morning:'Առավոտյան',evening:'Երեկոյան'};
var SHN={morning:'Առավոտյան հերթափոխ',evening:'Երեկոյան հերթափոխ'};
var settings,clock=function(){return new Date()},lastKey='',timer=0;
try{settings=sanitize(JSON.parse(localStorage.getItem(KEY)))}catch(e){settings=sanitize(null)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({shift:settings.shift}))}catch(e){}}
function setT(id,v){var e=$(id);if(e.textContent!==v)e.textContent=v}
function pad(n){return n<10?'0'+n:''+n}
function fmt(sec){var s=Math.max(0,Math.ceil(sec)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+pad(m):pad(m))+':'+pad(s%60)}
function dayText(nd){
 if(!nd)return'Դասերի օրեր նշված չեն։ Ընտրեք դրանք կարգավորումներում։';
 return'Հաջորդ դասերը՝ '+(nd.offset===1?'վաղը':WD[nd.weekday].toLowerCase())+', '+nd.start;
}
function render(now,st){
 var S=st.state,label,k='',num='',range='',next='',cd=false,ring=false;
 switch(S){
  case'IN_LESSON':label='Դասընթացն ընթանում է';k='Դասաժամ';num=''+st.lesson.n;range=st.lesson.startStr+' — '+st.lesson.endStr;cd=ring=true;
   next=st.next?'Հաջորդ դասաժամը՝ '+st.next.n+' · '+st.next.startStr:'Սա օրվա վերջին դասաժամն է';break;
  case'BREAK':label='Դասամիջոց';k='Հաջորդ դասաժամը';num=''+st.next.n;range='Դասամիջոց · '+st.prev.endStr+' — '+st.next.startStr;cd=ring=true;break;
  case'BEFORE_SCHOOL':label='Դասերը դեռ չեն սկսվել';k='Դասերը սկսվում են';num=st.next.startStr;range='Առաջին դասաժամը՝ '+st.next.n;cd=ring=true;next='Դասերն ավարտվում են՝ '+st.last.endStr;break;
  case'AFTER_SCHOOL':label='Դասերն ավարտվել են';k='Դասերն ավարտվել են';num=st.last.endStr;next=dayText(st.nextDay);break;
  default:label='Ազատ օր';num='Այսօր դասեր չկան';next=dayText(st.nextDay);
 }
 $('card').setAttribute('data-s',S);
 setT('date',WD[now.getDay()]+', '+now.getDate()+' '+MO[now.getMonth()]+' '+now.getFullYear());
 setT('shiftTxt',SHS[settings.shift]);$('shiftBtn').setAttribute('aria-label','Փոխել հերթափոխը՝ ընթացիկը '+SHN[settings.shift]);
 setT('k',k);setT('num',num);setT('range',range);setT('next',next);
 var nm=$('num').classList;nm.toggle('txt',S==='NON_SCHOOL_DAY');nm.toggle('mid',S==='AFTER_SCHOOL'||S==='BEFORE_SCHOOL');
 $('cdw').hidden=!cd;
 if(cd)setT('cd',fmt(st.remaining));
 var pr=ring?st.progress:0;
 $('arc').style.strokeDashoffset=(578.05*(1-pr)).toFixed(1);
 $('head').style.display=ring?'':'none';
 $('head').style.transform='rotate('+(pr*360).toFixed(2)+'deg)';
 $('ring').setAttribute('aria-valuenow',Math.round(pr*100));
 var key=[S,st.lesson?st.lesson.n:st.prev?st.prev.n:'',settings.shift,settings.lesson0,now.toDateString()].join('|');
 if(key!==lastKey){lastKey=key;setT('live',label+(cd&&num?'. '+k+' '+num:''))}
}
function tick(){
 clearTimeout(timer);
 if(document.hidden)return;
 try{var now=clock();render(now,computeState(now,settings))}catch(e){}
 timer=setTimeout(tick,1000-(Date.now()%1000)+20);
}
document.addEventListener('visibilitychange',function(){lastKey='';tick()});
window.addEventListener('focus',tick);
window.addEventListener('pageshow',tick);
window.zang={setClock:function(f){clock=f||function(){return new Date()};lastKey='';tick()}};
$('shiftBtn').addEventListener('click',function(){settings.shift=settings.shift==='morning'?'evening':'morning';save();lastKey='';tick()});
tick();
</script>
</body>
</html>
